<title>EmptyCrate.com: {{ page.title }}</title>
<meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
<meta charset="UTF-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="/favicon.png">

<link rel="stylesheet" href="/syntax.css">

<!-- Bootstrap 5 CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<!-- Bootstrap 5 JS (bundle includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">

<style>
.cs-blue {color:white; background: #31708f}
a.cs-blue { color:white; text-decoration: none; }
a:link.cs-blue { color:white; }
a:visited.cs-blue { color:white; }
a.cs-blue:hover { color: #ddd; }

.vcenter {
    display: inline-block;
    vertical-align: middle;
    float: none;
}

.youtube_thumbnail_nofloat {
    width: 120px;
    height: 70px;
    overflow: hidden;
    margin-right: 10px;
}

.youtube_thumbnail_nofloat img {
    width: 120px;
    height: 90px;
    margin: -10px 0px 0px 0px;
}


.youtube_thumbnail {
    width: 120px;
    height: 70px;
    overflow: hidden;
    margin-right: 10px;
    float: left;
}

.youtube_thumbnail img {
    width: 120px;
    height: 90px;
    margin: -10px 0px 0px 0px;
}

/* Navbar toggler icon visible on dark backgrounds */
.navbar-toggler { border-color: rgba(255,255,255,0.5); }
.navbar-toggler-icon { filter: invert(1); }

</style>


<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@lefticus">
<meta name="twitter:creator" content="@lefticus">
{% if page.title %}
  <meta name="twitter:title" content="{{ page.title }}">
{% else %}
  <meta name="twitter:title" content="{{ site.title }}">
{% endif %}
{% if page.url %}
  <meta name="twitter:url" content="{{ site.url }}{{ page.url }}">
{% endif %}
{% if page.excerpt %}
  <meta name="twitter:description" content="{{ page.excerpt | xml_escape }}">
{% else %}
  <meta name="twitter:description" content="{{ site.description | xml_escape }}">
{% endif %}
{% if page.youtube_id %}
  <meta name="twitter:image:src" content="https://img.youtube.com/vi/{{ page.youtube_id }}/default.jpg">
{% else %}
  <meta name="twitter:image:src" content="{{ site.url }}/logo.png">
{% endif %}


{% feed_meta %}
