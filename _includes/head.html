<title>EmptyCrate.com: {{ page.title }}</title>
<meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
<meta charset="UTF-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="/favicon.png">

<link rel="stylesheet" href="/syntax.css">

<!-- Bootstrap 5 CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<!-- Bootstrap 5 JS (bundle includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">

<style>
.cs-blue {color:white; background: #31708f}
a.cs-blue { color:white; text-decoration: none; }
a:link.cs-blue { color:white; }
a:visited.cs-blue { color:white; }
a.cs-blue:hover { color: #ddd; }

.vcenter {
    display: inline-block;
    vertical-align: middle;
    float: none;
}

.youtube_thumbnail_nofloat {
    width: 120px;
    height: 70px;
    overflow: hidden;
    margin-right: 10px;
}

.youtube_thumbnail_nofloat img {
    width: 120px;
    height: 90px;
    margin: -10px 0px 0px 0px;
}


.youtube_thumbnail {
    width: 120px;
    height: 70px;
    overflow: hidden;
    margin-right: 10px;
    float: left;
}

.youtube_thumbnail img {
    width: 120px;
    height: 90px;
    margin: -10px 0px 0px 0px;
}

/* Replacements for removed Bootstrap 3 components */
.jumbotron {
    padding: 2rem 1rem;
    margin-bottom: 2rem;
    border-radius: 0.3rem;
}

.panel {
    margin-bottom: 20px;
    background-color: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
}
.panel-default { border-color: #ddd; }
.panel-primary { border-color: #337ab7; }
.panel-success { border-color: #d6e9c6; }
.panel-info { border-color: #bce8f1; }
.panel-heading {
    padding: 10px 15px;
    border-bottom: 1px solid #ddd;
    border-radius: 3px 3px 0 0;
}
.panel-primary > .panel-heading { background-color: #337ab7; color: #fff; border-color: #337ab7; }
.panel-success > .panel-heading { background-color: #dff0d8; color: #3c763d; border-color: #d6e9c6; }
.panel-info > .panel-heading { background-color: #d9edf7; color: #31708f; border-color: #bce8f1; }
.panel-body { padding: 15px; }
.panel-title { margin: 0; font-size: 16px; }

.well { padding: 19px; background-color: #f5f5f5; border: 1px solid #e3e3e3; border-radius: 4px; }
.well-lg { padding: 24px; }

/* Breadcrumb - BS3 style (horizontal inline with separators) */
.breadcrumb {
    display: flex;
    flex-wrap: wrap;
    padding: 8px 15px;
    margin-bottom: 20px;
    list-style: none;
    background-color: #f5f5f5;
    border-radius: 4px;
}
.breadcrumb > li { display: inline-block; }
.breadcrumb > li + li::before {
    content: "/ ";
    padding: 0 5px;
    color: #ccc;
}
.breadcrumb > .active { color: #777; }
.breadcrumb > .active a { color: #777; }

.page-header {
    padding-bottom: 9px;
    margin: 40px 0 20px;
    border-bottom: 1px solid #eee;
}

/* BS5 link underline overrides for site chrome */
.jumbotron a, .navbar a { text-decoration: none; }
.panel-body a { text-decoration: none; }
.panel-body a:hover { text-decoration: underline; }

/* Navbar toggler icon visible on dark backgrounds */
.navbar-toggler { border-color: rgba(255,255,255,0.5); }
.navbar-toggler-icon { filter: invert(1); }

.pager {
    padding-left: 0;
    margin: 20px 0;
    list-style: none;
    text-align: center;
    display: flex;
    justify-content: space-between;
}
.pager li { display: inline; }
.pager li.disabled a { color: #777; cursor: not-allowed; pointer-events: none; }

</style>


<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@lefticus">
<meta name="twitter:creator" content="@lefticus">
{% if page.title %}
  <meta name="twitter:title" content="{{ page.title }}">
{% else %}
  <meta name="twitter:title" content="{{ site.title }}">
{% endif %}
{% if page.url %}
  <meta name="twitter:url" content="{{ site.url }}{{ page.url }}">
{% endif %}
{% if page.excerpt %}
  <meta name="twitter:description" content="{{ page.excerpt | xml_escape }}">
{% else %}
  <meta name="twitter:description" content="{{ site.description | xml_escape }}">
{% endif %}
{% if page.youtube_id %}
  <meta name="twitter:image:src" content="https://img.youtube.com/vi/{{ page.youtube_id }}/default.jpg">
{% else %}
  <meta name="twitter:image:src" content="{{ site.url }}/logo.png">
{% endif %}


{% feed_meta %}
